<!DOCTYPE html>
<html lang="id" data-tema="samudra">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel Admin — Bahan Ajar Matematika</title>

  <!-- Ikon tab browser -->
  <link id="favicon-situs" rel="icon" href="data:,">

  <!-- Lembar gaya tema dan tata letak komponen -->
  <link rel="stylesheet" href="assets/css/tema.css">
  <link rel="stylesheet" href="assets/css/app.css">

  <!-- Pustaka KaTeX agar pratinjau rumus di admin sama persis dengan tampilan siswa -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Kepala halaman admin -->
  <header id="header-admin" class="header-situs" role="banner">
    <div class="header-dalam">
      <div class="merek-situs">
        <div class="logo-cadangan">A</div>
        <div>
          <p class="judul-situs" id="judul-header-admin">Panel Admin</p>
          <p class="slogan-situs">Pengelolaan Bahan Ajar Matematika</p>
        </div>
      </div>
      <div id="aksi-header-admin" class="navigasi-utama"></div>
    </div>
  </header>

  <!-- Area utama: hanya menampilkan layar login sebelum password terverifikasi -->
  <main id="halaman-admin" class="halaman-utama" role="main">
    <div class="wadah" id="konten-admin">
      <div class="kotak-status">Menyiapkan halaman admin...</div>
    </div>
  </main>

  <!-- Kotak pemberitahuan mengambang (Tersimpan / Gagal) -->
  <div id="notifikasi-toast" class="notifikasi-toast" role="status" aria-live="polite" hidden></div>

  <!-- Kaki halaman admin -->
  <footer class="footer-situs" role="contentinfo">
    <div class="wadah">
      <p>Ruang Kelola Guru • Website Bahan Ajar Matematika</p>
    </div>
  </footer>

  <!-- Modul JavaScript admin (urutan pemuatan tidak boleh tertukar) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/embed.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
