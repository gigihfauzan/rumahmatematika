<!DOCTYPE html>
<html lang="id" data-tema="light_blue">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Nilai</title>
<!-- Cegah kedip tema: terapkan tema pribadi sebelum modul dimuat -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('enilai_tema');
      if (t) document.documentElement.setAttribute('data-tema', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/tema.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div class="spin spin-penuh"><div class="spin-dot"></div><span>Memuat E-Nilai...</span></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
