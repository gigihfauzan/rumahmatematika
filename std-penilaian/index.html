<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uji Kelayakan Apps Script — E-Nilai</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --border: #e2e8f0; --text: #1e293b;
    --muted: #64748b; --primary: #0f766e; --primary-fg: #ffffff;
    --ok: #16a34a; --err: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: .25rem 0 0; color: var(--muted); font-size: .85rem; }
  main {
    flex: 1; width: 100%; max-width: 880px; margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem;
  }
  .config { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .config input {
    flex: 1; min-width: 220px; padding: .5rem .65rem;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: .9rem; font-family: monospace;
  }
  .grid {
    display: grid; gap: .75rem;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  button {
    background: var(--primary); color: var(--primary-fg);
    border: none; border-radius: 8px; padding: .65rem .9rem;
    font-size: .9rem; cursor: pointer; text-align: left;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(.95); }
  .row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; }
  .status { font-size: .8rem; color: var(--muted); }
  pre {
    background: #0f172a; color: #e2e8f0; padding: .75rem;
    border-radius: 8px; overflow: auto; font-size: .8rem;
    max-height: 240px; margin: .5rem 0 0; white-space: pre-wrap; word-break: break-word;
  }
  .badge {
    display: inline-block; padding: .1rem .5rem; border-radius: 999px;
    font-size: .75rem; font-weight: 600;
  }
  .badge.ok { background: #dcfce7; color: var(--ok); }
  .badge.err { background: #fee2e2; color: var(--err); }
  .badge.wait { background: #fef3c7; color: var(--warn); }
  footer {
    text-align: center; color: var(--muted); font-size: .8rem;
    padding: 1rem; border-top: 1px solid var(--border); background: var(--card);
  }
</style>
</head>
<body>
<header>
  <h1>Uji Kelayakan Apps Script + belajar.id + GitHub Pages</h1>
  <p>Tahap 0 proyek E-Nilai. Isi URL web app di bawah, lalu tekan tombol uji satu per satu.</p>
</header>

<main>
  <div class="card">
    <div class="config">
      <label for="url" style="font-size:.85rem; font-weight:600;">URL Web App:</label>
      <input id="url" placeholder="https://script.google.com/macros/s/AKfyc.../exec" />
    </div>
    <p class="status" id="cfgStatus">URL belum diisi.</p>
  </div>

  <div class="card">
    <h2 style="font-size:1rem; margin:0 0 .75rem;">Tombol Uji</h2>
    <div class="grid">
      <button data-aksi="ping">a) Ping (GET)</button>
      <button data-aksi="ping_post">a) Ping (POST)</button>
      <button data-aksi="sheet_tulis_baca">b) Tulis &amp; baca Sheet</button>
      <button data-aksi="sheet_kedua">c) Baca Sheet kedua</button>
      <button data-aksi="drive_buat">d) Buat file Drive</button>
      <button data-aksi="lock">e) Uji LockService</button>
      <button data-aksi="info">g) Info konfigurasi</button>
      <button data-aksi="semua">f) Jalankan semua</button>
    </div>
  </div>

  <div id="hasil"></div>
</main>

<footer>Uji kelayakan E-Nilai — salin hasil ke tabel laporan.</footer>

<script>
// ============================================================
// KONFIGURASI
// Tempel URL web app Apps Script Anda di sini SEBELUM diunggah
// ke GitHub Pages. Anda juga dapat mengisinya lewat kotak di atas
// saat mencoba lokal.
// ============================================================
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyar_ISpxktfd9-VKoLEZ54RQvr9Ia5BWbU-mglsOh3Lls6R72QBUm9o91nKlYU5zSJdg/exec'; // contoh: https://script.google.com/macros/s/AKfyc.../exec

const urlInput = document.getElementById('url');
const cfgStatus = document.getElementById('cfgStatus');
if (WEB_APP_URL) { urlInput.value = WEB_APP_URL; }

function getUrl() {
  const u = (urlInput.value || WEB_APP_URL || '').trim();
  if (!u) { cfgStatus.textContent = 'URL belum diisi.'; return null; }
  cfgStatus.textContent = 'URL siap: ' + u;
  return u;
}
urlInput.addEventListener('input', getUrl);

// ============================================================
// KOMUNIKASI DENGAN WEB APP
// ============================================================

// GET (untuk ping via doGet).
async function panggilGet(url) {
  const t0 = performance.now();
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  const teks = await res.text();
  return { teks, ms: Math.round(performance.now() - t0), status: res.status };
}

// POST text/plain (menghindari preflight CORS).
async function panggilPost(url, payload) {
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    redirect: 'follow'
  });
  const teks = await res.text();
  return { teks, ms: Math.round(performance.now() - t0), status: res.status };
}

// Tafsirkan galat teknis menjadi pesan Indonesia yang mudah dipahami.
function tafsirGalat(pesan, status) {
  const s = String(pesan || '');
  if (s.includes('Failed to fetch')) {
    return 'Gagal menghubungi server. Kemungkinan:\n' +
           '1) Akses web app BUKAN "Siapa saja" (anonymous), sehingga server\n' +
           '   mengarahkan (redirect) ke halaman login Google dan browser\n' +
           '   memblokir respons (terlihat seperti CORS).\n' +
           '2) URL salah.\n' +
           '3) Jaringan/mirror memblokir script.google.com.\n' +
           'Solusi: periksa ulang pengaturan deploy (lihat panduan langkah 6).';
  }
  if (status === 0) return 'Tidak ada respons terbaca (kemungkinan redirect/CORS).';
  if (status === 401 || status === 403) {
    return 'Akses ditolak (HTTP ' + status + '). Web app mungkin diset\n' +
           '"Akun Google" saja, bukan "Siapa saja".';
  }
  return s || ('Status HTTP ' + status);
}

// ============================================================
// PENAMPIL HASIL
// ============================================================
const hasilDiv = document.getElementById('hasil');

function buatBlok(judul, teks, status) {
  const div = document.createElement('div');
  div.className = 'card';
  const badge = status === 'ok' ? '<span class="badge ok">Berhasil</span>'
              : status === 'err' ? '<span class="badge err">Gagal</span>'
              : '<span class="badge wait">Menunggu</span>';
  div.innerHTML =
    '<div class="row"><strong>' + judul + '</strong>' +
    '<span class="status">' + badge + '</span></div>' +
    '<pre></pre>';
  div.querySelector('pre').textContent = teks;
  hasilDiv.prepend(div);
  return div;
}

function setSelesai(div, status, teksPre, infoWaktu) {
  const badge = status === 'ok' ? 'ok' : 'err';
  div.querySelector('.badge').className = 'badge ' + badge;
  div.querySelector('.badge').textContent = status === 'ok' ? 'Berhasil' : 'Gagal';
  div.querySelector('.status').innerHTML =
    '<span class="badge ' + badge + '">' + (status === 'ok' ? 'Berhasil' : 'Gagal') + '</span>' +
    (infoWaktu ? ' &middot; ' + infoWaktu : '');
  if (teksPre != null) div.querySelector('pre').textContent = teksPre;
}

const JUDUL = {
  ping: 'a) Ping (GET)',
  ping_post: 'a) Ping (POST)',
  sheet_tulis_baca: 'b) Tulis & baca Sheet',
  sheet_kedua: 'c) Baca Sheet kedua',
  drive_buat: 'd) Buat file Drive',
  lock: 'e) Uji LockService',
  info: 'g) Info konfigurasi',
  semua: 'f) Jalankan semua aksi'
};

async function jalankan(aksi) {
  const url = getUrl();
  if (!url) { buatBlok('Konfigurasi', 'Isi URL web app dulu.', 'err'); return; }

  const div = buatBlok(JUDUL[aksi] || aksi, 'Menghubungi server...', 'wait');

  try {
    if (aksi === 'semua') {
      const daftar = ['ping', 'sheet_tulis_baca', 'sheet_kedua', 'drive_buat', 'lock'];
      const ringkas = [];
      for (const a of daftar) {
        const r = await panggilPost(url, { aksi: a });
        let obj; try { obj = JSON.parse(r.teks); } catch (e) { obj = { raw: r.teks }; }
        ringkas.push({
          aksi: a,
          ok: !!obj.ok,
          waktu_server: (obj.data && obj.data.waktu_ms) != null ? obj.data.waktu_ms : null,
          waktu_respons: r.ms,
          error: obj.error || null
        });
      }
      const adaGagal = ringkas.some(r => !r.ok);
      const total = ringkas.reduce((s, r) => s + (r.waktu_respons || 0), 0);
      setSelesai(div, adaGagal ? 'err' : 'ok',
        JSON.stringify(ringkas, null, 2),
        'total respons ~' + total + ' ms');
      return;
    }

    let hasil;
    if (aksi === 'ping') {
      hasil = await panggilGet(url);
    } else if (aksi === 'ping_post') {
      // Tombol "Ping (POST)": kirim aksi 'ping' melalui POST (bukan 'ping_post').
      hasil = await panggilPost(url, { aksi: 'ping' });
    } else {
      hasil = await panggilPost(url, { aksi: aksi });
    }

    let obj; try { obj = JSON.parse(hasil.teks); } catch (e) { obj = null; }

    if (obj && obj.ok) {
      const wServer = obj.data && obj.data.waktu_ms != null ? obj.data.waktu_ms : null;
      const info = hasil.ms + ' ms (respons)' + (wServer != null ? ' &middot; ' + wServer + ' ms (server)' : '');
      setSelesai(div, 'ok', JSON.stringify(obj.data, null, 2), info);
    } else {
      const pesan = obj && obj.error
        ? obj.error.pesan + '  [kode: ' + obj.error.kode + ']'
        : (hasil.teks || 'Respons bukan JSON.');
      setSelesai(div, 'err', pesan + '\n\n--- Raw ---\n' + hasil.teks, hasil.ms + ' ms');
    }
  } catch (err) {
    setSelesai(div, 'err', tafsirGalat(err.message, null), '');
  }
}

document.querySelectorAll('button[data-aksi]').forEach(function (btn) {
  btn.addEventListener('click', function () { jalankan(btn.dataset.aksi); });
});

getUrl();
</script>
</body>
</html>
